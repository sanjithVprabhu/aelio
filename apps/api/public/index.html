document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 system-ui, sans-serif;\n    background: var(--black);\n    color: var(--cream);\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n    font-weight: 400;\n    line-height: 1.6;\n  }\n\n  ::selection { background: var(--cream); color: var(--black); }\n\n  .wrap { max-width: var(--maxw); margin: 0 auto; padding-left: var(--pad); padding-right: var(--pad); }\n\n  /* ---------- Typographic primitives ---------- */\n  .label {\n    font-size: 0.72rem;\n    font-weight: 600;\n    text-transform: uppercase;\n    letter-spacing: 0.22em;\n  }\n  .wordmark {\n    font-weight: 700;\n    letter-spacing: -0.01em;\n    font-size: 1.32rem;\n    color: var(--black);\n    transition: color 0.4s var(--ease);\n  }\n  nav.scrolled .wordmark { color: var(--cream); }\n  .wordmark .dot { color: inherit; }\n\n  a { color: inherit; text-decoration: none; }\n\n  /* ---------- Buttons ---------- */\n  .btn {\n    display: inline-flex;\n    align-items: center;\n    gap: 0.6em;\n    font-weight: 600;\n    font-size: 0.98rem;\n    padding: 0.92em 1.6em;\n    border-radius: 8px;\n    border: 1px solid transparent;\n    cursor: pointer;\n    transition: background 0.4s var(--ease), color 0.4s var(--ease), border-color 0.4s var(--ease), transform 0.4s var(--ease);\n    line-height: 1;\n    font-family: inherit;\n  }\n  .btn-primary { background: var(--cream); color: var(--black); }\n  .btn-primary:hover { background: var(--white); transform: translateY(-1px); }\n  .btn-primary.on-light { background: var(--black); color: var(--cream); }\n  .btn-primary.on-light:hover { background: #1c1c1c; }\n  .btn-ghost { background: transparent; color: var(--black); border-color: var(--hair-dark); }\n  .btn-ghost:hover { border-color: var(--black); }\n  nav.scrolled .btn-ghost { color: var(--cream); border-color: var(--hair-light); }\n  nav.scrolled .btn-ghost:hover { border-color: var(--cream); }\n  nav .btn-primary.on-light { background: var(--black); color: var(--white); }\n  nav.scrolled .btn-primary.on-light { background: var(--cream); color: var(--black); }\n  .btn .arr { transition: transform 0.4s var(--ease); }\n  .btn:hover .arr { transform: translateX(3px); }\n\n  /* ---------- Nav ---------- */\n  nav {\n    position: fixed;\n    top: 0; left: 0; right: 0;\n    z-index: 100;\n    transition: background 0.5s var(--ease), border-color 0.5s var(--ease), backdrop-filter 0.5s var(--ease);\n    border-bottom: 1px solid transparent;\n  }\n  nav.scrolled {\n    background: rgba(10, 10, 10, 0.72);\n    backdrop-filter: blur(14px);\n    -webkit-backdrop-filter: blur(14px);\n    border-bottom: 1px solid var(--hair-light);\n  }\n  .nav-inner {\n    display: flex; align-items: center; justify-content: space-between;\n    height: 76px;\n  }\n  .nav-links { display: flex; align-items: center; gap: 1.6rem; }\n  .nav-links .btn + .btn { margin-left: calc(0.55rem - 1.6rem); }\n  .nav-links a.txt {\n    font-size: 0.92rem; font-weight: 500; color: var(--ink-70);\n    transition: color 0.3s var(--ease);\n  }\n  .nav-links .btn { padding: 0.62em 1.2em; font-size: 0.9rem; min-width: 114px; justify-content: center; }\n  .nav-links a.txt:hover { color: var(--black); }\n  nav.scrolled .nav-links a.txt { color: var(--cream-70); }\n  nav.scrolled .nav-links a.txt:hover { color: var(--cream); }\n  nav .wrap {\n    max-width: 100%;\n    padding-left: clamp(2rem, 6vw, 6rem);\n    padding-right: clamp(2rem, 6vw, 6rem);\n  }\n  /* Mobile nav hamburger */\n  .nav-ham {\n    display: none;\n    flex-direction: column;\n    justify-content: center;\n    gap: 5px;\n    width: 40px; height: 40px;\n    background: none; border: none; cursor: pointer;\n    padding: 8px;\n    border-radius: 6px;\n    transition: background 0.2s var(--ease);\n  }\n  .nav-ham:hover { background: rgba(10,10,10,0.06); }\n  nav.scrolled .nav-ham:hover { background: rgba(245,240,232,0.08); }\n  .nav-ham span {\n    display: block; height: 1.5px; width: 100%;\n    background: var(--black);\n    transition: transform 0.3s var(--ease), opacity 0.3s var(--ease), background 0.4s var(--ease);\n    transform-origin: center;\n  }\n  nav.scrolled .nav-ham span { background: var(--cream); }\n  nav.menu-open .nav-ham span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }\n  nav.menu-open .nav-ham span:nth-child(2) { transform: translateY(-6.5px) rotate(-45deg); }\n\n  /* Mobile dropdown menu */\n  .nav-mobile {\n    display: none;\n    flex-direction: column;\n    padding: 0.5rem clamp(2rem, 6vw, 6rem) 1.2rem;\n    background: var(--white);\n    border-top: 1px solid var(--hair-dark);\n    gap: 0;\n  }\n  nav.scrolled .nav-mobile { background: rgba(10,10,10,0.96); border-top-color: var(--hair-light); }\n  .nav-mobile a.mob-link {\n    font-size: 1.05rem; font-weight: 500;\n    color: var(--ink-70);\n    padding: 0.95rem 0;\n    border-bottom: 1px solid var(--hair-dark);\n    transition: color 0.2s var(--ease);\n  }\n  nav.scrolled .nav-mobile a.mob-link { color: var(--cream-70); border-bottom-color: var(--hair-light); }\n  .nav-mobile a.mob-link:hover { color: var(--black); }\n  nav.scrolled .nav-mobile a.mob-link:hover { color: var(--cream); }\n  .nav-mobile a.mob-link:last-child { border-bottom: none; }\n  .nav-mobile a.mob-link.primary {\n    color: var(--black); font-weight: 700;\n  }\n  nav.scrolled .nav-mobile a.mob-link.primary { color: var(--cream); }\n\n  @media (max-width: 720px) {\n    .nav-links a.txt { display: none; }\n    .nav-links .btn { display: none; }\n    .nav-ham { display: flex; }\n    nav.menu-open .nav-mobile { display: flex; }\n  }\n\n  /* ---------- Hero ---------- */\n  .hero {\n    position: relative;\n    background: var(--white);\n    color: var(--black);\n    padding-top: clamp(8rem, 16vh, 11rem);\n    padding-bottom: clamp(4rem, 9vh, 7rem);\n    overflow: hidden;\n  }\n  .hero-grid {\n    display: grid;\n    grid-template-columns: 1.05fr 0.95fr;\n    gap: clamp(2.5rem, 5vw, 5rem);\n    align-items: center;\n  }\n  @media (max-width: 940px) {\n    .hero-grid { grid-template-columns: 1fr; gap: 3.5rem; }\n  }\n  .hero .eyebrow {\n    display: inline-flex; align-items: center; gap: 0.7em;\n    color: var(--ink-45);\n    margin-bottom: 1.8rem;\n  }\n  .hero .eyebrow .pip {\n    width: 6px; height: 6px; border-radius: 50%;\n    background: var(--black);\n    box-shadow: 0 0 0 0 rgba(10,10,10,0.3);\n    animation: pulse 3.2s var(--ease) infinite;\n  }\n  @keyframes pulse {\n    0%, 100% { box-shadow: 0 0 0 0 rgba(10,10,10,0.3); }\n    50% { box-shadow: 0 0 0 5px rgba(10,10,10,0); }\n  }\n  h1.hero-h {\n    font-size: clamp(2.6rem, 6.2vw, 5rem);\n    font-weight: 800;\n    letter-spacing: -0.035em;\n    line-height: 1.02;\n    text-wrap: balance;\n  }\n  h1.hero-h em {\n    font-style: normal;\n    color: var(--ink-45);\n  }\n  .hero-sub {\n    margin-top: 1.9rem;\n    font-size: clamp(1.05rem, 1.5vw, 1.28rem);\n    color: var(--ink-70);\n    max-width: 46ch;\n    font-weight: 400;\n  }\n  .hero-cta { margin-top: 2.6rem; display: flex; gap: 1rem; flex-wrap: wrap; }\n  @media (max-width: 540px) {\n    .hero-cta { flex-direction: column; }\n    .hero-cta .btn { width: 100%; justify-content: center; }\n  }\n  .hero-meta {\n    margin-top: 1.2rem;\n    display: flex; align-items: center; gap: 0.8rem;\n    color: var(--ink-45);\n    font-size: 0.86rem;\n  }\n  /* Hero buttons on white bg */\n  .hero .btn-primary { background: var(--black); color: var(--cream); }\n  .hero .btn-primary:hover { background: #1c1c1c; }\n  .hero .btn-ghost { color: var(--black); border-color: rgba(10,10,10,0.2); }\n  .hero .btn-ghost:hover { border-color: var(--black); }\n\n  /* ---------- Conversation demo ---------- */\n  .demo {\n    background: var(--cream);\n    border: 1px solid var(--hair-dark);\n    border-radius: 10px;\n    padding: 1.4rem 1.4rem 1.5rem;\n    box-shadow: 0 16px 48px -24px rgba(10,10,10,0.13);\n  }\n  .demo-head {\n    display: flex; align-items: center; gap: 0.7rem;\n    padding-bottom: 1.1rem;\n    border-bottom: 1px solid var(--hair-dark);\n    margin-bottom: 1.2rem;\n  }\n  .demo-head .ae {\n    width: 30px; height: 30px; border-radius: 6px;\n    background: var(--black); color: var(--cream);\n    display: grid; place-items: center;\n    font-weight: 800; font-size: 0.95rem; letter-spacing: -0.02em;\n  }\n  .demo-head .who { font-size: 0.9rem; font-weight: 600; color: var(--black); }\n  .demo-head .stat {\n    margin-left: auto; font-size: 0.7rem; color: var(--ink-45);\n    text-transform: uppercase; letter-spacing: 0.16em; font-weight: 600;\n    display: flex; align-items: center; gap: 0.45em;\n  }\n  .demo-head .stat .g { width: 5px; height: 5px; border-radius: 50%; background: #7fd39b; }\n  .msgs { display: flex; flex-direction: column; gap: 0.85rem; }\n  .msg { max-width: 86%; font-size: 0.95rem; line-height: 1.5; }\n  .msg .bubble {\n    padding: 0.7rem 0.95rem; border-radius: 12px;\n    display: inline-block;\n  }\n  .msg.user { align-self: flex-end; text-align: right; }\n  .msg.user .bubble {\n    background: #262626; color: var(--cream);\n    border-bottom-right-radius: 4px;\n  }\n  .msg.ae { align-self: flex-start; }\n  .msg.ae .bubble {\n    background: var(--white); color: var(--black);\n    border: 1px solid var(--hair-dark);\n    border-bottom-left-radius: 4px;\n    font-weight: 450;\n  }\n  .action-chip {\n    align-self: flex-start;\n    display: inline-flex; align-items: center; gap: 0.55em;\n    font-size: 0.78rem; font-weight: 600;\n    color: var(--ink-70);\n    border: 1px solid var(--hair-dark);\n    padding: 0.5em 0.85em; border-radius: 100px;\n    letter-spacing: 0.01em;\n  }\n  .action-chip .spin {\n    width: 11px; height: 11px; border-radius: 50%;\n    border: 1.5px solid var(--ink-45); border-top-color: var(--black);\n    animation: spin 0.9s linear infinite;\n  }\n  @keyframes spin { to { transform: rotate(360deg); } }\n  /* staged fade-in of messages */\n  .stagger > * { opacity: 0; transform: translateY(8px); }\n  .stagger.go > * { animation: msgIn 0.55s var(--ease) forwards; }\n  .stagger.go > *:nth-child(1) { animation-delay: 0.15s; }\n  .stagger.go > *:nth-child(2) { animation-delay: 0.55s; }\n  .stagger.go > *:nth-child(3) { animation-delay: 1.05s; }\n  .stagger.go > *:nth-child(4) { animation-delay: 1.5s; }\n  .stagger.go > *:nth-child(5) { animation-delay: 3.4s; }\n  @keyframes msgIn { to { opacity: 1; transform: translateY(0); } }\n  .action-chip.resolved { color: var(--black); border-color: var(--hair-dark); transition: color 0.4s, border-color 0.4s; }\n  .action-chip .check { font-size: 11px; line-height: 1; }\n\n  /* ---------- Section shells ---------- */\n  section.band { padding: clamp(5rem, 11vh, 9rem) 0; }\n  .band.cream { background: var(--cream); color: var(--black); }\n  .band.white { background: var(--white); color: var(--black); }\n  .band.black { background: var(--black); color: var(--cream); }\n\n  .sec-head { max-width: 760px; margin-bottom: clamp(3rem, 6vw, 4.5rem); }\n  .sec-head .label { color: currentColor; opacity: 0.55; }\n  .sec-head h2 {\n    font-size: clamp(2rem, 4.4vw, 3.3rem);\n    font-weight: 700;\n    letter-spacing: -0.025em;\n    line-height: 1.08;\n    margin-top: 1.1rem;\n    text-wrap: balance;\n  }\n  .sec-head p {\n    margin-top: 1.3rem;\n    font-size: clamp(1.02rem, 1.4vw, 1.2rem);\n    max-width: 50ch;\n    opacity: 0.7;\n  }\n\n  /* ---------- How it works ---------- */\n  .steps {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 0;\n    border-top: 1px solid var(--hair-dark);\n  }\n  @media (max-width: 820px) { .steps { grid-template-columns: 1fr; } }\n  .step {\n    padding: 2.4rem 2rem 2.6rem;\n    border-bottom: 1px solid var(--hair-dark);\n    border-right: 1px solid var(--hair-dark);\n    display: flex;\n    flex-direction: column;\n  }\n  .step:last-child { border-right: none; }\n  @media (max-width: 820px) {\n    .step { border-right: none; }\n  }\n  .step .num {\n    font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em;\n    color: var(--ink-45);\n    font-variant-numeric: tabular-nums;\n  }\n  .step h3 {\n    font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em;\n    margin-top: 1.6rem; line-height: 1.15;\n  }\n  .step p { margin-top: 0.85rem; font-size: 1rem; color: var(--ink-70); flex: 1; }\n  .step .code {\n    margin-top: 1.3rem;\n    font-family: 'Hanken Grotesk', monospace;\n    font-size: 0.82rem; font-weight: 600;\n    border-radius: 4px;\n    padding: 0.5em 0.75em;\n    display: inline-block; letter-spacing: 0.01em;\n    align-self: flex-start;\n  }\n  .step:nth-child(1) .code {\n    background: rgba(99, 139, 255, 0.10);\n    border: 1px solid rgba(99, 139, 255, 0.28);\n    color: #3a5fd9;\n  }\n  .step:nth-child(2) .code {\n    background: rgba(52, 199, 120, 0.10);\n    border: 1px solid rgba(52, 199, 120, 0.28);\n    color: #1e8c53;\n  }\n  .step:nth-child(3) .code {\n    background: rgba(180, 100, 255, 0.09);\n    border: 1px solid rgba(180, 100, 255, 0.26);\n    color: #7c3fc5;\n  }\n\n  /* ---------- Pillars ---------- */\n  .pillars {\n    display: grid;\n    grid-template-columns: repeat(2, 1fr);\n    gap: clamp(2.2rem, 4vw, 3.5rem) clamp(2.5rem, 5vw, 5rem);\n  }\n  @media (max-width: 720px) { .pillars { grid-template-columns: 1fr; } }\n  .pillar { padding-top: 1.8rem; border-top: 1px solid var(--hair-dark); }\n  .pillar .pn {\n    font-size: 0.74rem; font-weight: 700; text-transform: uppercase;\n    letter-spacing: 0.2em; color: var(--ink-45);\n  }\n  .pillar h3 {\n    font-size: clamp(1.5rem, 2.3vw, 1.95rem); font-weight: 700;\n    letter-spacing: -0.02em; margin-top: 1rem; line-height: 1.12;\n  }\n  .pillar p { margin-top: 0.9rem; font-size: 1.04rem; color: var(--ink-70); max-width: 44ch; }\n\n  /* ---------- Emotional intelligence ---------- */\n  .ei-grid {\n    display: grid;\n    grid-template-columns: repeat(5, 1fr);\n    border: 1px solid var(--hair-light);\n    border-radius: 8px;\n    overflow: hidden;\n  }\n  @media (max-width: 900px) { .ei-grid { grid-template-columns: 1fr 1fr; } }\n  @media (max-width: 520px) { .ei-grid { grid-template-columns: 1fr; } }\n  .ei {\n    padding: 1.9rem 1.5rem 2.1rem;\n    border-right: 1px solid var(--hair-light);\n    transition: background 0.4s var(--ease);\n  }\n  .ei:last-child { border-right: none; }\n  @media (max-width: 900px) {\n    .ei { border-right: 1px solid var(--hair-light); border-bottom: 1px solid var(--hair-light); }\n  }\n  .ei:hover { background: rgba(245,240,232,0.04); }\n  .ei .stage {\n    font-size: 0.72rem; font-weight: 700; text-transform: uppercase;\n    letter-spacing: 0.14em; color: var(--cream-45);\n  }\n  .ei .mood {\n    font-size: 1.18rem; font-weight: 700; letter-spacing: -0.01em;\n    margin-top: 0.8rem;\n  }\n  .ei p { margin-top: 0.85rem; font-size: 0.92rem; color: var(--cream-70); line-height: 1.55; }\n\n  /* ---------- CTA ---------- */\n  .cta-grid {\n    display: grid; grid-template-columns: 1fr 1fr;\n    gap: clamp(2.5rem, 6vw, 6rem); align-items: start;\n  }\n  @media (max-width: 860px) { .cta-grid { grid-template-columns: 1fr; gap: 3rem; } }\n  .cta-grid h2 {\n    font-size: clamp(2.1rem, 4.6vw, 3.5rem); font-weight: 700;\n    letter-spacing: -0.028em; line-height: 1.05; text-wrap: balance;\n  }\n  .cta-grid .lede { margin-top: 1.4rem; font-size: 1.15rem; color: var(--ink-70); max-width: 38ch; }\n  .demo-points { margin-top: 2.2rem; display: flex; flex-direction: column; gap: 1rem; }\n  .demo-points li { list-style: none; display: flex; gap: 0.8rem; font-size: 1.02rem; color: var(--ink-70); }\n  .demo-points li .ck { color: var(--black); font-weight: 800; }\n\n  form.demo-form { display: flex; flex-direction: column; gap: 1.05rem; }\n  .field { display: flex; flex-direction: column; gap: 0.5rem; }\n  .field label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-45); }\n  .field input, .field select {\n    font-family: inherit; font-size: 1rem; color: var(--black);\n    background: var(--white);\n    border: 1px solid var(--hair-dark);\n    border-radius: 4px;\n    padding: 0.85em 1em;\n    transition: border-color 0.3s var(--ease);\n    width: 100%;\n  }\n  .field input:focus, .field select:focus { outline: none; border-color: var(--black); }\n  .field input::placeholder { color: var(--ink-45); }\n  form.demo-form .btn-primary.on-light { width: 100%; justify-content: center; margin-top: 0.4rem; }\n  .form-note { font-size: 0.82rem; color: var(--ink-45); }\n  .form-success {\n    display: none;\n    padding: 2.4rem 1.8rem; text-align: left;\n    border: 1px solid var(--hair-dark); border-radius: 6px;\n    background: var(--white);\n  }\n  .form-success.show { display: block; }\n  .form-success .ttl { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; }\n  .form-success p { margin-top: 0.7rem; color: var(--ink-70); }\n\n  /* ---------- Footer ---------- */\n  footer { background: var(--black); color: var(--cream); padding: clamp(3.5rem, 7vw, 5rem) 0 2.5rem; border-top: 1px solid var(--hair-light); }\n  footer .wrap {\n    max-width: 100%;\n    padding-left: clamp(2rem, 6vw, 6rem);\n    padding-right: clamp(2rem, 6vw, 6rem);\n  }\n  footer .wordmark { color: var(--white); }\n  .foot-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 2rem; flex-wrap: wrap; }\n  .foot-desc { font-size: 0.95rem; color: var(--cream-45); max-width: 26ch; margin-top: 0.3rem; }\n  .foot-links { display: flex; gap: 3.5rem; flex-wrap: wrap; }\n  .foot-col { display: flex; flex-direction: column; gap: 0.85rem; }\n  .foot-col .label { color: var(--cream-45); margin-bottom: 0.3rem; }\n  .foot-col a { font-size: 0.95rem; color: var(--cream-70); transition: color 0.3s var(--ease); }\n  .foot-col a:hover { color: var(--cream); }\n  .foot-bottom {\n    margin-top: clamp(3rem, 6vw, 4.5rem); padding-top: 1.8rem;\n    border-top: 1px solid var(--hair-light);\n    display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap;\n    font-size: 0.82rem; color: var(--cream-45);\n  }\n\n  /* ---------- Reveal animation ---------- */\n  /* Gated behind .js so content is visible if scripts/IO never run (fail open). */\n  .js .reveal { opacity: 0; transform: translateY(22px); transition: opacity 0.7s var(--ease), transform 0.7s var(--ease); }\n  .reveal { opacity: 1; transform: none; }\n  .reveal.in { opacity: 1; transform: none; }\n  .reveal.d1 { transition-delay: 0.08s; }\n  .reveal.d2 { transition-delay: 0.16s; }\n  .reveal.d3 { transition-delay: 0.24s; }\n  .reveal.d4 { transition-delay: 0.32s; }\n\n  /* ---------- Mobile global ---------- */\n  @media (max-width: 640px) {\n    section.band { padding: clamp(3rem, 8vw, 5rem) 0; }\n    .hero { padding-top: 6.5rem; padding-bottom: 3rem; }\n    .hero-sub br { display: none; }\n    .sec-head h2 br { display: none; }\n    .step { padding: 1.8rem 1.4rem 2rem; }\n    .pillar { padding-top: 1.4rem; }\n    .cta-grid h2 { font-size: clamp(1.8rem, 7vw, 2.6rem); }\n    .cta-grid .lede { font-size: 1rem; }\n    .demo-points { margin-top: 1.4rem; gap: 0.75rem; }\n    .demo-points li { font-size: 0.97rem; }\n    .field input { padding: 0.95em 1em; font-size: 1rem; }\n    form.demo-form .btn-primary.on-light { padding: 1em; }\n    .foot-links { gap: 2rem; }\n    .foot-bottom { flex-direction: column; gap: 0.5rem; }\n  }\n  @media (max-width: 480px) {\n    .msg { font-size: 0.9rem; }\n    .msg .bubble { padding: 0.6rem 0.85rem; }\n  }\n\n  @media (prefers-reduced-motion: reduce) {\n    * { animation: none !important; }\n    .js .reveal { opacity: 1; transform: none; transition: none; }\n    .stagger > * { opacity: 1; transform: none; }\n    html { scroll-behavior: auto; }\n  }\n<\u002Fstyle>\n\n\n<\u002Fhead><body>\n\n<!-- ===================== NAV ===================== -->\n<nav id=\"nav\">\n  <div class=\"wrap nav-inner\">\n    <a href=\"#top\" class=\"wordmark\">Aelio<span class=\"dot\">.<\u002Fspan><\u002Fa>\n    <div class=\"nav-links\">\n      <a href=\"#how\" class=\"txt\">How it works<\u002Fa>\n      <a href=\"#pillars\" class=\"txt\">Capabilities<\u002Fa>\n      <a href=\"#demo\" class=\"btn btn-ghost\">Book a demo<\u002Fa>\n      <a href=\"#demo\" class=\"btn btn-primary on-light\">Sign in<\u002Fa>\n    <\u002Fdiv>\n    <button class=\"nav-ham\" id=\"navHam\" aria-label=\"Open menu\" aria-expanded=\"false\">\n      <span><\u002Fspan><span><\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"nav-mobile\" id=\"navMobile\" aria-hidden=\"true\">\n    <a href=\"#how\" class=\"mob-link\" id=\"mobHow\">How it works<\u002Fa>\n    <a href=\"#pillars\" class=\"mob-link\" id=\"mobPillars\">Capabilities<\u002Fa>\n    <a href=\"#demo\" class=\"mob-link\" id=\"mobDemo\">Book a demo<\u002Fa>\n    <a href=\"#demo\" class=\"mob-link primary\" id=\"mobSign\">Sign in<\u002Fa>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- ===================== HERO ===================== -->\n<header class=\"hero\" id=\"top\" data-screen-label=\"Hero\">\n  <div class=\"wrap hero-grid\">\n    <div class=\"hero-copy\" data-comment-anchor=\"141a0fb287-div\">\n      <h1 class=\"hero-h reveal d1\" data-comment-anchor=\"ddd475dbd0-h1\">Give your<br>SaaS a mind<br><em>with a voice.<\u002Fem><\u002Fh1>\n      <p class=\"hero-sub reveal d2\">Aelio turns your product into an action-capable conversational interface. Your users<br>stop navigating and start doing.<\u002Fp>\n      <div class=\"hero-cta reveal d3\">\n        <a href=\"#demo\" class=\"btn btn-primary\">Sign in <span class=\"arr\">→<\u002Fspan><\u002Fa>\n        <a href=\"#demo\" class=\"btn btn-ghost\">Book a demo<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"hero-meta reveal d4\">Conversational intelligence for SaaS platforms<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- conversation demo -->\n    <div class=\"demo reveal d2\" aria-hidden=\"true\">\n      <div class=\"demo-head\">\n        <div class=\"ae\">A<\u002Fdiv>\n        <span class=\"who\">Aelio<\u002Fspan>\n        <span class=\"stat\"><span class=\"g\"><\u002Fspan>Active<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"msgs stagger\" id=\"demoMsgs\" data-comment-anchor=\"8f1629926e-div\">\n        <!-- Populated dynamically by JS on load -->\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ===================== HOW IT WORKS ===================== -->\n<section class=\"band cream\" id=\"how\" data-screen-label=\"How it works\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <span class=\"label\">How it works<\u002Fspan>\n      <h2>Drop in your OpenAPI spec. Aelio handles the rest.<\u002Fh2>\n      <p>No rebuilding. No retraining your team.<br>A conversational intelligence layer on top of the product<br>you already shipped — live in minutes, not months.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"steps\">\n      <div class=\"step reveal\">\n        <span class=\"num\">01 — Connect<\u002Fspan>\n        <h3>Aelio learns your platform<\u002Fh3>\n        <p>Point Aelio at your OpenAPI spec. It maps your workflows, endpoints, and data model into type-safe tools it can call on a user's behalf.<\u002Fp>\n        <span class=\"code\" data-comment-anchor=\"a4336c9ddd-span\">openapi.yaml →<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"step reveal d1\">\n        <span class=\"num\">02 — Converse<\u002Fspan>\n        <h3>Users speak in intent<\u002Fh3>\n        <p>On WhatsApp, Slack, or embedded directly in your product, users say what they want. Aelio reads intent, lifecycle stage, and emotional state.<\u002Fp>\n        <span class=\"code\">WhatsApp · Slack · Embedded Chat<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"step reveal d2\">\n        <span class=\"num\">03 — Act<\u002Fspan>\n        <h3>Aelio does the work<\u002Fh3>\n        <p>It completes tasks, triggers workflows, and navigates complexity — then surfaces the friction and retention signals behind every session.<\u002Fp>\n        <span class=\"code\">type-safe tool calls<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== PILLARS ===================== -->\n<section class=\"band white\" id=\"pillars\" data-screen-label=\"Capabilities\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <span class=\"label\">Capabilities<\u002Fspan>\n      <h2>Not a chatbot.<br>A capable presence.<\u002Fh2>\n      <p data-comment-anchor=\"7e9d63bec9-p\">Reads intent. Executes actions. Adapts to every user.<br>So you always know what they need next.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"pillars\">\n      <div class=\"pillar reveal\">\n        <span class=\"pn\">01 — Action<\u002Fspan>\n        <h3>It doesn't just answer. It does.<\u002Fh3>\n        <p>Users complete tasks, trigger workflows, and navigate complexity — all through conversation. The interface stops being something to learn.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"pillar reveal d1\">\n        <span class=\"pn\">02 — Intelligence<\u002Fspan>\n        <h3>State-aware. Lifecycle-aware.<\u002Fh3>\n        <p>Aelio knows where a user is in their journey and how they feel right now and responds accordingly. More context than any static interface could hold.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"pillar reveal d2\">\n        <span class=\"pn\">03 — Integration<\u002Fspan>\n        <h3>Spec in. Interface out.<\u002Fh3>\n        <p>OpenAPI spec in, conversational interface out. WhatsApp, Slack, or embedded chat. Aelio connects where your users already are.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"pillar reveal d3\">\n        <span class=\"pn\">04 — Insight<\u002Fspan>\n        <h3>Every conversation is data.<\u002Fh3>\n        <p>Aelio surfaces adoption signals, friction points, and retention risks before they become churn. You finally know why users drop off — and when.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== CTA / BOOK A DEMO ===================== -->\n<section class=\"band cream\" id=\"demo\" data-screen-label=\"Book a demo\">\n  <div class=\"wrap cta-grid\">\n    <div class=\"reveal\">\n      <span class=\"label\" style=\"opacity:0.55;\">Get early access<\u002Fspan>\n      <h2 style=\"margin-top:1.1rem;\">See Aelio inside your platform.<\u002Fh2>\n      <p class=\"lede\">We're onboarding a select group of SaaS teams. Book a demo and we'll connect Aelio to your product — live, in the session.<\u002Fp>\n      <ul class=\"demo-points\">\n        <li><span class=\"ck\">→<\u002Fspan> A working demo on your OpenAPI spec.<\u002Fli>\n        <li><span class=\"ck\">→<\u002Fspan> Have a conversation with your platform.<\u002Fli>\n        <li><span class=\"ck\">→<\u002Fspan> Discover adoption signals you've been missing.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"reveal d2\">\n      <form class=\"demo-form\" id=\"demoForm\" novalidate=\"\">\n        <div class=\"field\">\n          <label for=\"name\">Name<\u002Flabel>\n          <input id=\"name\" name=\"name\" type=\"text\" placeholder=\"Your name\" required=\"\">\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label for=\"email\">Work email<\u002Flabel>\n          <input id=\"email\" name=\"email\" type=\"email\" placeholder=\"you@company.com\" required=\"\">\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label for=\"company\">Platform / company<\u002Flabel>\n          <input id=\"company\" name=\"company\" type=\"text\" placeholder=\"What do you build?\" required=\"\">\n        <\u002Fdiv>\n        <button type=\"submit\" class=\"btn btn-primary on-light\">Book a demo <span class=\"arr\">→<\u002Fspan><\u002Fbutton>\n        <span class=\"form-note\">By invitation only. We reply within two business days.<\u002Fspan>\n      <\u002Fform>\n      <div class=\"form-success\" id=\"formSuccess\">\n        <div class=\"ttl\">Request received.<\u002Fdiv>\n        <p>Thank you — we'll be in touch within two business days to set up your demo. Aelio will be ready.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== FOOTER ===================== -->\n<footer data-screen-label=\"Footer\">\n  <div class=\"wrap\">\n    <div class=\"foot-top\">\n      <div>\n        <a href=\"#top\" class=\"wordmark\">Aelio<span class=\"dot\">.<\u002Fspan><\u002Fa>\n        <p class=\"foot-desc\">Conversational intelligence for SaaS platforms.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"foot-links\">\n        <div class=\"foot-col\">\n          <span class=\"label\">Product<\u002Fspan>\n          <a href=\"#how\">How it works<\u002Fa>\n          <a href=\"#pillars\">Capabilities<\u002Fa>\n        <\u002Fdiv>\n        <div class=\"foot-col\">\n          <span class=\"label\">Get started<\u002Fspan>\n          <a href=\"#demo\">Sign in<\u002Fa>\n          <a href=\"#demo\">Book a demo<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot-bottom\">\n      <span>© 2026 UNIQ Global Labs Pvt. Ltd.<\u002Fspan>\n      <span>The best butler doesn't wait to be asked.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n  // Hamburger menu\n  const ham = document.getElementById('navHam');\n  const mobMenu = document.getElementById('navMobile');\n  if (ham && mobMenu) {\n    ham.addEventListener('click', () => {\n      const open = nav.classList.toggle('menu-open');\n      ham.setAttribute('aria-expanded', open);\n      mobMenu.setAttribute('aria-hidden', !open);\n    });\n    // Close on any mobile link click\n    mobMenu.querySelectorAll('a').forEach((a) => {\n      a.addEventListener('click', () => {\n        nav.classList.remove('menu-open');\n        ham.setAttribute('aria-expanded', 'false');\n        mobMenu.setAttribute('aria-hidden', 'true');\n      });\n    });\n  }\n\n  // ---- Conversation scenarios ----\n  const SCENARIOS = [\n    {\n      messages: [\n        { type: 'user', text: \"I've been going in circles for 20 minutes trying to share this report with my team.\" },\n        { type: 'ae',   text: \"I've got it. Who needs access, and should they be able to edit or just view?\", anchor: \"577c6ba921-span\" },\n        { type: 'user', text: \"Sarah and James. View only.\" },\n        { type: 'chip', text: \"Sharing with 2 members\", resolved: \"Shared with 2 members\", anchor: \"717b5fcbb4-div\" },\n        { type: 'ae',   text: \"Done. Sarah and James can now view it, link sent. Anything else you've been stuck on?\" }\n      ]\n    },\n    {\n      messages: [\n        { type: 'user', text: \"Can you schedule the sales dashboard to go to my manager every Monday at 9am?\" },\n        { type: 'ae',   text: \"On it. Which manager, and should it go as a PDF or a live link?\" },\n        { type: 'user', text: \"Priya. PDF is fine.\" },\n        { type: 'chip', text: \"Scheduling weekly report\", resolved: \"Report scheduled\" },\n        { type: 'ae',   text: \"Done. Priya gets the sales dashboard every Monday at 9am. I'll flag it if anything changes.\" }\n      ]\n    },\n    {\n      messages: [\n        { type: 'user', text: \"We need to downgrade our plan before renewal next week.\" },\n        { type: 'ae',   text: \"You're on Pro. Downgrading to Starter removes 3 seats and API access. Still want to proceed?\" },\n        { type: 'user', text: \"Yes, we don't use the API.\" },\n        { type: 'chip', text: \"Updating plan\", resolved: \"Plan updated\" },\n        { type: 'ae',   text: \"Done. You're on Starter from next renewal. Confirmation is in your inbox.\" }\n      ]\n    }\n  ];\n\n  function buildScenario() {\n    const msgs = document.getElementById('demoMsgs');\n    if (!msgs) return;\n    const lastIdx = parseInt(sessionStorage.getItem('aelio_s') || '-1', 10);\n    let idx;\n    do { idx = Math.floor(Math.random() * SCENARIOS.length); } while (idx === lastIdx && SCENARIOS.length > 1);\n    sessionStorage.setItem('aelio_s', idx);\n    const scenario = SCENARIOS[idx];\n    msgs.innerHTML = '';\n    scenario.messages.forEach((m) => {\n      if (m.type === 'user') {\n        const d = document.createElement('div');\n        d.className = 'msg user';\n        d.innerHTML = '<span class=\"bubble\">' + m.text.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) + '<\u002Fspan>';\n        msgs.appendChild(d);\n      } else if (m.type === 'ae') {\n        const d = document.createElement('div');\n        d.className = 'msg ae';\n        const span = document.createElement('span');\n        span.className = 'bubble';\n        if (m.anchor) span.setAttribute('data-comment-anchor', m.anchor);\n        span.textContent = m.text;\n        d.appendChild(span);\n        msgs.appendChild(d);\n      } else if (m.type === 'chip') {\n        const d = document.createElement('div');\n        d.className = 'action-chip';\n        if (m.anchor) d.setAttribute('data-comment-anchor', m.anchor);\n        d.dataset.resolved = m.resolved;\n        const spin = document.createElement('span');\n        spin.className = 'spin';\n        d.appendChild(spin);\n        d.appendChild(document.createTextNode(m.text));\n        msgs.appendChild(d);\n      }\n    });\n  }\n  buildScenario();\n\n  // Nav background on scroll\n  const nav = document.getElementById('nav');\n  const onScroll = () => { nav.classList.toggle('scrolled', window.scrollY > 24); };\n  onScroll();\n  window.addEventListener('scroll', onScroll, { passive: true });\n\n  // Scroll reveal — IntersectionObserver with robust fallbacks so content\n  // is guaranteed visible even if IO callbacks never fire in this environment.\n  const revealEls = Array.from(document.querySelectorAll('.reveal'));\n  const demoMsgs = document.getElementById('demoMsgs');\n  let demoTriggered = false;\n\n  // Resolve the action chip: stop spinner, show checkmark, update label.\n  // Called ~3s after the conversation starts (chip appears at 1.5s, spins ~1.5s).\n  function resolveChip() {\n    const chip = demoMsgs ? demoMsgs.querySelector('.action-chip') : null;\n    if (!chip) return;\n    const resolvedText = chip.dataset.resolved || 'Done';\n    const spinner = chip.querySelector('.spin');\n    if (spinner) {\n      const check = document.createElement('span');\n      check.className = 'check';\n      check.textContent = '✓';\n      spinner.replaceWith(check);\n    }\n    chip.childNodes.forEach((n) => { if (n.nodeType === 3) n.textContent = resolvedText; });\n    chip.classList.add('resolved');\n  }\n\n  function triggerDemo() {\n    if (demoTriggered) return;\n    demoTriggered = true;\n    demoMsgs.classList.add('go');\n    setTimeout(resolveChip, 3000);\n  }\n\n  function revealInView() {\n    const vh = window.innerHeight || document.documentElement.clientHeight;\n    revealEls.forEach((el) => {\n      if (el.classList.contains('in')) return;\n      const r = el.getBoundingClientRect();\n      if (r.top < vh * 0.92 && r.bottom > 0) el.classList.add('in');\n    });\n    if (demoMsgs && !demoTriggered) {\n      const r = demoMsgs.getBoundingClientRect();\n      if (r.top < vh * 0.9 && r.bottom > 0) triggerDemo();\n    }\n  }\n\n  if ('IntersectionObserver' in window) {\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }\n      });\n    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });\n    revealEls.forEach((el) => io.observe(el));\n\n    if (demoMsgs) {\n      const demoIO = new IntersectionObserver((entries) => {\n        entries.forEach((e) => {\n          if (e.isIntersecting) { triggerDemo(); demoIO.unobserve(e.target); }\n        });\n      }, { threshold: 0.4 });\n      demoIO.observe(demoMsgs);\n    }\n  }\n\n  // Fallbacks: scroll/resize position check, above-fold immediate reveal,\n  // and a safety timeout that reveals everything if IO never fires.\n  window.addEventListener('scroll', revealInView, { passive: true });\n  window.addEventListener('resize', revealInView, { passive: true });\n  revealInView();\n  requestAnimationFrame(revealInView);\n  setTimeout(revealInView, 200);\n  setTimeout(() => {\n    revealEls.forEach((el) => el.classList.add('in'));\n    if (!demoTriggered) triggerDemo();\n  }, 1400);\n\n  // Form\n  const form = document.getElementById('demoForm');\n  const success = document.getElementById('formSuccess');\n  form.addEventListener('submit', (ev) => {\n    ev.preventDefault();\n    if (!form.checkValidity()) { form.reportValidity(); return; }\n    form.style.display = 'none';\n    success.classList.add('show');\n  });\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
