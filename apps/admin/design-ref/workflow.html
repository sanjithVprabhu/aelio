  };
  const handleStateDragEnd = () => { setDragStateId(null); setDragOverStateId(null); };

  const handleSkillDragStart = (e, skillId, stateId) => { e.stopPropagation(); setDragSkill({skillId,stateId}); e.dataTransfer.effectAllowed='move'; };
  const handleSkillDragOver  = (e, skillId) => { e.preventDefault(); e.stopPropagation(); if(dragSkill&&skillId!==dragSkill.skillId) setDragOverSkillId(skillId); };
  const handleSkillDrop = (e, tSkillId, tStateId) => {
    e.preventDefault(); e.stopPropagation();
    if (!dragSkill||dragSkill.skillId===tSkillId||dragSkill.stateId!==tStateId) { setDragSkill(null); setDragOverSkillId(null); return; }
    setStates(prev=>prev.map(s=>{
      if(s.id!==tStateId) return s;
      const arr=[...s.skills], fi=arr.findIndex(sk=>sk.id===dragSkill.skillId), ti=arr.findIndex(sk=>sk.id===tSkillId);
      const [item]=arr.splice(fi,1); arr.splice(ti,0,item); return {...s,skills:arr};
    }));
    setDragSkill(null); setDragOverSkillId(null);
  };
  const handleSkillDragEnd = () => { setDragSkill(null); setDragOverSkillId(null); };

  const tog = id => setOpenStates(o=>({...o,[id]:!o[id]}));
  const STATUS_COLOR = { active:'var(--green)', draft:'var(--amber)', paused:'var(--ink-22)' };
  const STATUS_OPTIONS = [
    { value:'active', label:'Active', color:'var(--green)',  bg:'var(--green-bg)', Icon:I.check   },
    { value:'draft',  label:'Draft',  color:'var(--amber)',  bg:'var(--amber-bg)', Icon:I.pencil  },
    { value:'delete', label:'Delete', color:'var(--red)',    bg:'var(--red-bg)',   Icon:I.trash, danger:true },
  ];
  const handleAddState = () => {
    if (!newName.trim()) return;
    const id = 'custom-' + Date.now();
    setStates(s=>[...s,{id,label:newName.trim().toUpperCase(),sublabel:newSub.trim()||'Custom state',color:newColor,open:true,skills:[]}]);
    setOpenStates(o=>({...o,[id]:true}));
    setNewName(''); setNewSub(''); setNewColor('#3562C8'); setAddingState(false);
  };
  const handleAddSkill = (label) => {
    if (!label || !label.trim() || !addingSkill) return;
    const newSkill = { id:'sk-'+Date.now(), label:label.trim(), status:'draft' };
    setStates(prev=>prev.map(s=>s.id!==addingSkill.stateId ? s : {...s, skills:[...s.skills, newSkill]}));
    setOpenStates(o=>({...o,[addingSkill.stateId]:true}));
    setAddingSkill(null); setCustomSkillName(''); setSelectedTemplate(null); setSkillSearch('');
  };

  return (
    <div style={{width:collapsed?40:252,flexShrink:0,background:'var(--bg)',borderRight:'1px solid var(--ink-10)',display:'flex',flexDirection:'column',overflow:'hidden',transition:'width 0.22s var(--ease)'}}>

      {collapsed && (
        <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',padding:'12px 0 16px',gap:14,cursor:'pointer'}} onClick={()=>setCollapsed(false)}>
          <span style={{color:'var(--ink-45)',display:'flex',padding:'4px',borderRadius:6,transition:'background 0.15s'}}
            onMouseEnter={e=>e.currentTarget.style.background='var(--ink-05)'}
            onMouseLeave={e=>e.currentTarget.style.background='transparent'}><I.arrow /></span>
          <span style={{writingMode:'vertical-rl',textOrientation:'mixed',transform:'rotate(180deg)',fontSize:11,fontWeight:700,letterSpacing:'0.06em',color:'var(--ink-45)',userSelect:'none',whiteSpace:'nowrap'}}>State Management</span>
        </div>
      )}

      {statusPopup && (
        <>
          <div style={{position:'fixed',inset:0,zIndex:98}} onClick={()=>setStatusPopup(null)} />
          <div style={{position:'fixed',left:statusPopup.x,top:statusPopup.y,zIndex:99,background:'var(--white)',border:'1px solid var(--ink-10)',borderRadius:9,boxShadow:'0 4px 20px rgba(0,0,0,0.10)',padding:'4px',minWidth:128}}>
            {STATUS_OPTIONS.map(opt => {
              const isCur = skillStatuses[statusPopup.skillId]===opt.value;
              return (
                <div key={opt.value} onClick={()=>{
                    if (opt.danger) {
                      setStates(prev=>prev.map(s=>({...s,skills:s.skills.filter(sk=>sk.id!==statusPopup.skillId)})));
                    } else {
                      setSkillStatuses(s=>({...s,[statusPopup.skillId]:opt.value}));
                    }
                    setStatusPopup(null);
                  }}
                  style={{display:'flex',alignItems:'center',gap:8,padding:'6px 10px',borderRadius:6,cursor:'pointer',fontSize:12.5,fontWeight:isCur?600:400,background:isCur?opt.bg:'transparent',transition:'background 0.1s'}}
                  onMouseEnter={e=>e.currentTarget.style.background=opt.danger?'var(--red-bg)':isCur?opt.bg:'var(--ink-05)'}
                  onMouseLeave={e=>e.currentTarget.style.background=isCur?opt.bg:'transparent'}>
                  <span style={{display:'flex',color:opt.color,flexShrink:0}}><opt.Icon /></span>
                  <span style={{flex:1,color:opt.danger?'var(--red)':'inherit'}}>{opt.label}</span>
                  {isCur && !opt.danger && <span style={{fontSize:10,color:opt.color}}>✓</span>}
                </div>
              );
            })}
          </div>
        </>
      )}

      {!collapsed && (
        <div style={{padding:'12px 14px 10px',borderBottom:'1px solid var(--ink-10)',flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            {(addingState||addingSkill)
              ? <span style={{color:'var(--ink-45)',display:'flex',cursor:'pointer',transform:'rotate(180deg)'}} onClick={()=>{setAddingState(false);setAddingSkill(null);setCustomSkillName('');setSelectedTemplate(null);setSkillSearch('');}}><I.arrow /></span>
              : <span style={{color:'var(--ink-45)',display:'flex'}}><I.cycle /></span>}
            <span style={{fontSize:14,fontWeight:700,letterSpacing:'-0.015em',flex:1}}>{addingSkill?'New Skill':addingState?'New State':'State Management'}</span>
            {!addingState && (
              <span style={{color:'var(--ink-22)',display:'flex',cursor:'pointer',padding:'3px',borderRadius:5,transition:'background 0.15s,color 0.15s'}}
                onClick={()=>setCollapsed(true)}
                onMouseEnter={e=>{e.currentTarget.style.background='var(--ink-05)';e.currentTarget.style.color='var(--ink-70)';}}
                onMouseLeave={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.color='var(--ink-22)';}}>
                <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
              </span>
            )}
          </div>
        </div>
      )}

      {!collapsed && (addingSkill ? (
        <div style={{flex:1,overflowY:'auto',padding:'12px 14px'}}>
          {/* Search bar */}
          <div style={{display:'flex',alignItems:'center',gap:7,padding:'7px 10px',background:'var(--white)',border:'1px solid var(--ink-22)',borderRadius:8,marginBottom:12,transition:'border-color 0.15s',boxShadow:'0 1px 4px rgba(0,0,0,.05)'}}
            onFocusCapture={e=>e.currentTarget.style.borderColor='var(--ink-45)'}
            onBlurCapture={e=>e.currentTarget.style.borderColor='var(--ink-10)'}>
            <span style={{display:'flex',color:'var(--ink-45)',flexShrink:0}}><I.search /></span>
            <input autoFocus value={skillSearch} onChange={e=>setSkillSearch(e.target.value)} placeholder="Search skills..."
              style={{flex:1,border:'none',outline:'none',fontSize:13,color:'var(--ink)',background:'transparent',fontFamily:'inherit'}} />
            {skillSearch && (
              <span onClick={()=>setSkillSearch('')} style={{display:'flex',color:'var(--ink-22)',cursor:'pointer',padding:'2px',borderRadius:4,transition:'color 0.12s'}}
                onMouseEnter={e=>e.currentTarget.style.color='var(--ink-70)'}
                onMouseLeave={e=>e.currentTarget.style.color='var(--ink-22)'}>
                <svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </span>
            )}
          </div>
          {/* Template list */}
          {(() => {
            const filtered = SKILL_TEMPLATES.filter(t =>
              !skillSearch || t.label.toLowerCase().includes(skillSearch.toLowerCase()) || t.desc.toLowerCase().includes(skillSearch.toLowerCase())
            );
            return filtered.length === 0 ? (
              <div style={{textAlign:'center',padding:'18px 0',color:'var(--ink-22)',fontSize:12.5}}>No skills match "{skillSearch}"</div>
            ) : (
              <div style={{display:'flex',flexDirection:'column',gap:4,marginBottom:14}}>
                {filtered.map(t => {
                  const isSel = selectedTemplate===t.id;
                  return (
                    <div key={t.id} onClick={()=>setSelectedTemplate(isSel?null:t.id)}
                      style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:9,border:'1.5px solid '+(isSel?'var(--ink)':'var(--ink-10)'),background:isSel?'var(--ink)':'var(--white)',cursor:'pointer',transition:'all 0.12s',userSelect:'none'}}
                      onMouseEnter={e=>{if(!isSel){e.currentTarget.style.borderColor='var(--ink-22)';e.currentTarget.style.background='var(--ink-05)';}}}
                      onMouseLeave={e=>{if(!isSel){e.currentTarget.style.borderColor='var(--ink-10)';e.currentTarget.style.background='var(--white)';}}}
                    >
                      <span style={{display:'flex',flexShrink:0,color:isSel?'rgba(255,255,255,.65)':'var(--ink-45)'}}><t.Icon /></span>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:12.5,fontWeight:600,color:isSel?'var(--white)':'var(--ink)',lineHeight:1.25}}>{t.label}</div>
                        <div style={{fontSize:10.5,color:isSel?'rgba(255,255,255,.48)':'var(--ink-45)',marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.desc}</div>
                      </div>
                      {isSel && (
                        <span style={{display:'flex',color:'rgba(255,255,255,.7)',flexShrink:0}}>
                          <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        </span>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })()}
          {selectedTemplate && (
            <button onClick={()=>handleAddSkill(SKILL_TEMPLATES.find(t=>t.id===selectedTemplate)?.label)}
              style={{width:'100%',padding:'8px 0',fontSize:13,fontWeight:600,background:'var(--ink)',color:'var(--white)',border:'none',borderRadius:8,cursor:'pointer',fontFamily:'inherit',marginBottom:12,transition:'opacity 0.15s'}}
              onMouseEnter={e=>e.currentTarget.style.opacity='.8'}
              onMouseLeave={e=>e.currentTarget.style.opacity='1'}>
              Add — {SKILL_TEMPLATES.find(t=>t.id===selectedTemplate)?.label}
            </button>
          )}
          <div style={{display:'flex',alignItems:'center',gap:8,margin:'4px 0 12px'}}>
            <div style={{flex:1,height:1,background:'var(--ink-10)'}}/>
            <span style={{fontSize:10.5,fontWeight:500,color:'var(--ink-45)'}}>or custom</span>
            <div style={{flex:1,height:1,background:'var(--ink-10)'}}/>
          </div>
          <div style={{marginBottom:10}}>
            <label style={{display:'block',fontSize:11,fontWeight:600,letterSpacing:'0.05em',textTransform:'uppercase',color:'var(--ink-45)',marginBottom:6}}>Skill name</label>
            <input value={customSkillName} onChange={e=>setCustomSkillName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleAddSkill(customSkillName)} placeholder="e.g. Upsell prompt"
              style={{width:'100%',padding:'8px 10px',fontSize:13,border:'1px solid var(--ink-22)',borderRadius:8,background:'var(--white)',color:'var(--ink)',outline:'none',fontFamily:'inherit',transition:'border-color 0.15s'}}
              onFocus={e=>e.target.style.borderColor='var(--ink-70)'} onBlur={e=>e.target.style.borderColor='var(--ink-22)'} />
          </div>
          <button onClick={()=>handleAddSkill(customSkillName)}
            style={{width:'100%',padding:'9px 0',fontSize:13,fontWeight:600,background:customSkillName.trim()?'var(--ink)':'var(--ink-10)',color:customSkillName.trim()?'var(--white)':'var(--ink-45)',border:'none',borderRadius:8,cursor:customSkillName.trim()?'pointer':'not-allowed',fontFamily:'inherit',transition:'background 0.15s,color 0.15s'}}>
            Create skill
          </button>
        </div>
      ) : addingState ? (
        <div style={{flex:1,overflowY:'auto',padding:'16px 14px'}}>
          <div style={{marginBottom:16}}>
            <label style={{display:'block',fontSize:11,fontWeight:600,letterSpacing:'0.05em',textTransform:'uppercase',color:'var(--ink-45)',marginBottom:6}}>State name</label>
            <input autoFocus value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleAddState()} placeholder="e.g. CHURNED"
              style={{width:'100%',padding:'8px 10px',fontSize:13,fontWeight:500,border:'1px solid var(--ink-22)',borderRadius:8,background:'var(--white)',color:'var(--ink)',outline:'none',fontFamily:'inherit',letterSpacing:'0.02em',transition:'border-color 0.15s'}}
              onFocus={e=>e.target.style.borderColor='var(--ink-70)'} onBlur={e=>e.target.style.borderColor='var(--ink-22)'} />
          </div>
          <div style={{marginBottom:18}}>
            <label style={{display:'block',fontSize:11,fontWeight:600,letterSpacing:'0.05em',textTransform:'uppercase',color:'var(--ink-45)',marginBottom:6}}>Description</label>
            <input value={newSub} onChange={e=>setNewSub(e.target.value.slice(0,30))} onKeyDown={e=>e.key==='Enter'&&handleAddState()} placeholder="Where the user is in their journey" maxLength={30}
              style={{width:'100%',padding:'8px 10px',fontSize:13,border:'1px solid var(--ink-22)',borderRadius:8,background:'var(--white)',color:'var(--ink)',outline:'none',fontFamily:'inherit',transition:'border-color 0.15s'}}
              onFocus={e=>e.target.style.borderColor='var(--ink-70)'} onBlur={e=>e.target.style.borderColor='var(--ink-22)'} />
            <div style={{textAlign:'right',fontSize:11,color:newSub.length>=26?'var(--orange)':'var(--ink-22)',marginTop:4}}>{newSub.length}/30</div>
          </div>
          <div style={{marginBottom:24}}>
            <label style={{display:'block',fontSize:11,fontWeight:600,letterSpacing:'0.05em',textTransform:'uppercase',color:'var(--ink-45)',marginBottom:8}}>Colour</label>
            <div style={{display:'flex',flexWrap:'wrap',gap:7}}>
              {COLOR_SWATCHES.map(c=>(
                <div key={c} onClick={()=>setNewColor(c)}
                  style={{width:22,height:22,borderRadius:6,background:c,cursor:'pointer',outline:newColor===c?'1.5px solid '+c:'1.5px solid transparent',outlineOffset:2,transition:'outline 0.12s,transform 0.12s',transform:newColor===c?'scale(1.15)':'scale(1)'}}/>
              ))}
            </div>
            <div style={{display:'flex',alignItems:'center',gap:8,marginTop:14,padding:'8px 10px',background:'var(--ink-05)',borderRadius:8}}>
              <span style={{width:3,height:20,borderRadius:100,background:newColor,flexShrink:0}}/>
              <div>
                <div style={{fontSize:10.5,fontWeight:700,letterSpacing:'0.08em',color:'var(--ink)'}}>{newName.toUpperCase()||'STATE NAME'}</div>
                <div style={{fontSize:10.5,color:'var(--ink-45)'}}>{newSub||'Description'}</div>
              </div>
            </div>
          </div>
          <button onClick={handleAddState}
            style={{width:'100%',padding:'9px 0',fontSize:13,fontWeight:600,background:newName.trim()?'var(--ink)':'var(--ink-10)',color:newName.trim()?'var(--white)':'var(--ink-45)',border:'none',borderRadius:8,cursor:newName.trim()?'pointer':'not-allowed',fontFamily:'inherit',transition:'background 0.15s,color 0.15s'}}>
            Create state
          </button>
        </div>
      ) : (
        <div style={{flex:1,overflowY:'auto',padding:'4px 0 8px'}}>
          {states.map(state => {
            const isOpen = openStates[state.id];
            return (
              <div key={state.id} draggable
                onDragStart={e=>handleStateDragStart(e,state.id)}
                onDragOver={e=>handleStateDragOver(e,state.id)}
                onDrop={e=>handleStateDrop(e,state.id)}
                onDragEnd={handleStateDragEnd}
                onMouseEnter={()=>setHoveredState(state.id)}
                onMouseLeave={()=>setHoveredState(null)}
                style={{marginBottom:1,opacity:dragStateId===state.id?0.4:1,borderTop:dragOverStateId===state.id?'2px solid var(--ink-22)':'2px solid transparent',transition:'opacity 0.15s,border-color 0.1s'}}>
                <div onClick={()=>tog(state.id)}
                  style={{display:'flex',alignItems:'center',gap:7,padding:'7px 12px',cursor:'pointer',userSelect:'none',transition:'background 0.15s'}}
                  onMouseEnter={e=>e.currentTarget.style.background='var(--ink-05)'}
                  onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                  <span style={{opacity:hoveredState===state.id?0.28:0,display:'flex',flexShrink:0,color:'var(--ink)',cursor:'grab',transition:'opacity 0.12s',marginRight:-2}} onClick={e=>e.stopPropagation()}><I.grip /></span>
                  <span style={{color:'var(--ink-22)',display:'flex',transform:isOpen?'rotate(0deg)':'rotate(-90deg)',transition:'transform 0.18s var(--ease)',flexShrink:0}}><I.chevD /></span>
                  <span style={{width:3,height:20,borderRadius:100,background:state.color,flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:10.5,fontWeight:700,letterSpacing:'0.08em',color:'var(--ink)',lineHeight:1.3}}>{state.label}</div>
                    <div style={{fontSize:10.5,color:'var(--ink-45)',fontWeight:400,lineHeight:1.3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{state.sublabel}</div>
                  </div>
                  <span style={{fontSize:10,fontWeight:600,color:'var(--ink-45)',background:'var(--ink-05)',borderRadius:4,padding:'1px 5px',flexShrink:0,minWidth:16,textAlign:'center'}}>{state.skills.length}</span>
                </div>
                {isOpen && (
                  <div style={{paddingBottom:2}}>
                    {state.skills.map(skill => {
                      const on = sel===skill.id;
                      const curStatus = skillStatuses[skill.id]||skill.status;
                      return (
                        <div key={skill.id} draggable
                          onDragStart={e=>handleSkillDragStart(e,skill.id,state.id)}
                          onDragOver={e=>handleSkillDragOver(e,skill.id)}
                          onDrop={e=>handleSkillDrop(e,skill.id,state.id)}
                          onDragEnd={handleSkillDragEnd}
                          onClick={()=>setSel(skill.id)}
                          onMouseEnter={()=>setHoveredSkill(skill.id)}
                          onMouseLeave={()=>setHoveredSkill(null)}
                          style={{display:'flex',alignItems:'center',gap:6,padding:'5px 12px 5px 40px',cursor:'pointer',fontSize:12.5,fontWeight:on?500:400,background:on?'var(--white)':'transparent',boxShadow:on?'inset 2px 0 0 '+state.color:'inset 2px 0 0 transparent',opacity:dragSkill?.skillId===skill.id?0.4:1,borderTop:dragOverSkillId===skill.id?'2px solid '+state.color:'2px solid transparent',transition:'background 0.12s,box-shadow 0.12s,opacity 0.15s,border-color 0.1s'}}>
                          <span style={{opacity:(hoveredSkill===skill.id||on)?0.6:0,display:'flex',flexShrink:0,color:'var(--ink)',cursor:'grab',transition:'opacity 0.12s'}}><I.grip /></span>
                          <span style={{flex:1,lineHeight:1.4,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:on?'var(--ink)':curStatus==='paused'?'var(--ink-22)':'var(--ink-70)'}}>{skill.label}</span>
                          <span title={'Status: '+curStatus}
                            onClick={e=>{ e.stopPropagation(); const r=e.currentTarget.getBoundingClientRect(); setStatusPopup({skillId:skill.id,x:r.right+6,y:r.top-6}); }}
                            style={{width:8,height:8,borderRadius:'50%',background:STATUS_COLOR[curStatus],flexShrink:0,opacity:curStatus==='paused'?0.35:0.85,cursor:'pointer',transition:'transform 0.12s,opacity 0.12s'}}
                            onMouseEnter={e=>{ e.stopPropagation(); e.currentTarget.style.transform='scale(1.5)'; e.currentTarget.style.opacity='1'; }}
                            onMouseLeave={e=>{ e.currentTarget.style.transform='scale(1)'; e.currentTarget.style.opacity=curStatus==='paused'?'0.35':'0.85'; }}
                          />
                        </div>
                      );
                    })}
                    <div onClick={()=>{setAddingSkill({stateId:state.id});setCustomSkillName('');setSelectedTemplate(null);setSkillSearch('');}}
                      style={{display:'flex',alignItems:'center',gap:5,padding:'4px 12px 4px 34px',fontSize:11.5,color:'var(--ink-22)',cursor:'pointer',userSelect:'none',transition:'color 0.15s'}}
                      onMouseEnter={e=>e.currentTarget.style.color='var(--ink-70)'}
                      onMouseLeave={e=>e.currentTarget.style.color='var(--ink-22)'}>
                      <I.plus /><span>New skill</span>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
          <div style={{display:'flex',alignItems:'center',gap:6,padding:'7px 12px 12px',cursor:'pointer',userSelect:'none',transition:'color 0.15s',color:'var(--ink-22)'}}
            onClick={()=>setAddingState(true)}
            onMouseEnter={e=>e.currentTarget.style.color='var(--ink-70)'}
            onMouseLeave={e=>e.currentTarget.style.color='var(--ink-22)'}>
            <I.plus /><span style={{fontSize:12,fontWeight:500}}>Add state</span>
          </div>
        </div>
      ))}
    </div>
  );
}

/* ─── Topbar ─── */
function Topbar({ sidebarOpen, setSidebarOpen, selSkill }) {
  const allSkills = LIFECYCLE_STATES.flatMap(s => s.skills.map(sk => ({...sk, stateName: s.label})));
  const currentSkill = allSkills.find(sk => sk.id === selSkill);
  const currentState = LIFECYCLE_STATES.find(s => s.skills.some(sk => sk.id === selSkill));
  return (
    <div style={{height:52,background:'var(--white)',borderBottom:'1px solid var(--ink-10)',display:'flex',alignItems:'center',padding:'0 14px 0 16px',gap:10,flexShrink:0,position:'relative',zIndex:10}}>
      <button onClick={()=>setSidebarOpen(o=>!o)} style={{width:32,height:32,background:'none',border:'none',cursor:'pointer',color:'var(--ink-70)',borderRadius:7,display:'grid',placeItems:'center',flexShrink:0,transition:'background 0.15s,color 0.15s'}}
        onMouseEnter={e=>{e.currentTarget.style.background='var(--ink-05)';e.currentTarget.style.color='var(--ink)';}}
        onMouseLeave={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.color='var(--ink-70)';}}>
        <I.menu />
      </button>
      <div style={{display:'flex',alignItems:'center',gap:7,fontSize:13,color:'var(--ink-45)'}}>
        <span style={{display:'flex',alignItems:'center',gap:5,color:'var(--ink)',fontWeight:600}}><I.flow />Playbooks</span>
        <span style={{color:'var(--ink-22)'}}>›</span>
        <span>{currentState ? currentState.label.charAt(0) + currentState.label.slice(1).toLowerCase() : 'Onboarding'}</span>
        <span style={{color:'var(--ink-22)'}}>›</span>
        <span style={{color:'var(--ink)',fontWeight:500}}>{currentSkill ? currentSkill.label : 'Setup guide'}</span>
      </div>
      {/* Search — absolutely centred in the bar */}

/* ─── SVG Connections ─── */
const Connections = memo(function Connections({ nodes, edges, selId }) {
  const nMap = {};
  nodes.forEach(nd => { nMap[nd.id] = nd; });
  return (
    <svg style={{position:'absolute',top:0,left:0,width:1200,height:960,pointerEvents:'none',overflow:'visible',zIndex:2}}>
      {edges.map(e => {
        const s = nMap[e.from], d = nMap[e.to];
        if (!s || !d) return null;
        /* Horizontal flow: right edge of source → left edge of dest */
        const x1 = s.x + NW + 4;
        const y1 = s.y + NH / 2;
        const x2 = d.x - 4;
        const y2 = d.y + NH / 2;
        const isSel = selId === e.from || selId === e.to;
        const isW = e.warn;
        const col = isW ? 'rgba(196,56,56,.52)' : isSel ? 'rgba(53,98,200,.65)' : 'rgba(10,10,10,.22)';
        const aw = 4, ah = 7;
        const arrowTipX = x2 + 1;
        const arrowBaseX = arrowTipX - ah;
        return (
          <g key={e.id}>
            <line x1={x1} y1={y1} x2={arrowBaseX - 1} y2={y2} stroke={col} strokeWidth="1.5" strokeDasharray={isW ? '5,4' : '4,3'} />
            <polygon points={`${arrowBaseX},${y2-aw} ${arrowBaseX},${y2+aw} ${arrowTipX},${y2}`} fill={col} />
            {isW && (
              <text x={(x1+x2)/2} y={y1 - 8} fontSize="9" fill="rgba(196,56,56,.75)" fontFamily="'Hanken Grotesk',sans-serif" fontWeight="700" textAnchor="middle">no match</text>
            )}
          </g>
        );
      })}
    </svg>
  );
});

/* ─── Ghost edge from n10 to ghost node ─── */
function GhostEdge() {
  /* Horizontal ghost: right of n10 → left of ghost node */
  const x1 = NX + H_STEP + NW + 4;  /* right edge of n10 + offset */
  const x2 = NX + 2*H_STEP - 4;     /* left edge of ghost node */
  const y  = NY[2] + NH / 2;
  return (
    <line x1={x1} y1={y} x2={x2} y2={y} stroke="rgba(10,10,10,.1)" strokeWidth="1.5" strokeDasharray="4,3" style={{pointerEvents:'none'}} />
  );
}

/* ─── Minimap ─── */
function Minimap({ transform }) {
  const W = 118, H = 88, CW = 1120, CH = 860;

  const sc = SKILLS_DEF;
  /* Skill boxes now stacked vertically, spanning nodes horizontally */
  const skillBoxes = [
    { x:32*S,  y:20*S,  w:1000*S, h:320*S, c:sc[0].c },
    { x:32*S,  y:340*S, w:1000*S, h:320*S, c:sc[1].c },
    { x:32*S,  y:660*S, w:540*S,  h:320*S, c:sc[2].c },
  ];

  // Viewport rect in minimap coords
  const vpW = Math.min(W, (window.innerWidth * 0.7 / transform.scale) * S);
  const vpH = Math.min(H, (window.innerHeight * 0.75 / transform.scale) * S);
  const vpX = Math.max(0, (-transform.x / transform.scale) * S);

  return (
    <div style={{position:'absolute',bottom:82,right:16,width:W,height:H,background:'var(--white)',border:'1px solid var(--ink-22)',borderRadius:9,boxShadow:'0 2px 10px rgba(0,0,0,.07)',zIndex:5,overflow:'hidden'}}>

        {NODES_DEF.map(nd=>{
          const nt = NT[nd.type];

        <div style={{position:'absolute',left:vpX,top:vpY,width:vpW,height:vpH,border:'1.5px solid rgba(53,98,200,.5)',borderRadius:2,background:'rgba(53,98,200,.05)',pointerEvents:'none'}}/>

/* ─── Workflow Canvas ─── */
function WorkflowCanvas({ selNode, setSelNode, onTest, selSkill }) {
  const [transform, setTransform] = useState({ x:14, y:18, scale:0.60 });
  const [hovSkill, setHovSkill] = useState(null);
  const [ctxMenu, setCtxMenu] = useState(null);
  const [nodes, setNodes] = useState(NODES_DEF);
  const [showDiff, setShowDiff] = useState(false);
  const containerRef = useRef();
  const isDragging = useRef(false);
  const didMove = useRef(false);
  const dragStart = useRef({ x:0, y:0, tx:0, ty:0 });

  const handleWheel = useCallback(e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 0.91;
    const rect = containerRef.current.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    setTransform(t => {
      const ns = Math.min(2.8, Math.max(0.25, t.scale * factor));
      const sf = ns / t.scale;
      return { x: mx - sf*(mx-t.x), y: my - sf*(my-t.y), scale:ns };
    });
  }, []);

  useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    el.addEventListener('wheel', handleWheel, { passive:false });
    return () => el.removeEventListener('wheel', handleWheel);
  }, [handleWheel]);

  const onMouseDown = e => {
    if (e.button !== 0) return;
    const isCanvas = e.target === e.currentTarget || e.target === containerRef.current;
    if (!isCanvas) return;
    isDragging.current = true;
    didMove.current = false;
    dragStart.current = { x:e.clientX, y:e.clientY, tx:transform.x, ty:transform.y };
  };

  const onMouseMove = e => {
    if (!isDragging.current) return;
    const dx = e.clientX - dragStart.current.x, dy = e.clientY - dragStart.current.y;
    if (Math.abs(dx)+Math.abs(dy) > 3) didMove.current = true;
    setTransform(t => ({ ...t, x:dragStart.current.tx+dx, y:dragStart.current.ty+dy }));
  };

  const onMouseUp = e => {
    if (isDragging.current && !didMove.current) { setSelNode(null); setCtxMenu(null); }
    isDragging.current = false;
  };

  const handleCtxMenu = useCallback((e, node) => {
    setCtxMenu({ x:e.clientX, y:e.clientY, node });
  }, []);

  const handleSelect = useCallback(id => setSelNode(id), [setSelNode]);
  const deleteNode = useCallback(id => { setNodes(ns => ns.filter(n=>n.id!==id)); if(selNode===id) setSelNode(null); }, [selNode,setSelNode]);

  const resetZoom = () => setTransform({ x:14, y:18, scale:0.60 });

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',background:'var(--white)',overflow:'hidden',position:'relative'}}>
      <CanvasTopbar onPublish={()=>{}} onSimulate={onTest} showDiff={showDiff} setShowDiff={setShowDiff} selSkill={selSkill} />

      {/* Canvas body */}
      <div ref={containerRef}
        onMouseDown={onMouseDown} onMouseMove={onMouseMove} onMouseUp={onMouseUp} onMouseLeave={onMouseUp}
        style={{flex:1,position:'relative',overflow:'hidden',background:'var(--bg)',backgroundImage:'radial-gradient(circle, rgba(10,10,10,.12) 1px, transparent 1px)',backgroundSize:'24px 24px',cursor:isDragging.current?'grabbing':'grab'}}>

        {/* Transformed content */}
        <div style={{position:'absolute',top:0,left:0,transform:`translate(${transform.x}px,${transform.y}px) scale(${transform.scale})`,transformOrigin:'0 0',width:1120,height:860}}>
          {/* Skill bounding boxes */}
          {SKILLS_DEF.map(sk => (
            <SkillBox key={sk.id} skill={sk} nodes={nodes} hoveredSkill={hovSkill} onHover={setHovSkill} />
          ))}
          {/* SVG connections */}
          <Connections nodes={nodes} edges={EDGES_DEF} selId={selNode} />
          {/* Ghost edge s3 */}
          <svg style={{position:'absolute',top:0,left:0,width:1200,height:960,pointerEvents:'none',overflow:'visible',zIndex:2}}>
            <GhostEdge />
          </svg>
          {/* Nodes */}
          {nodes.map(nd => (
            <WorkflowNode key={nd.id} node={nd} isSelected={selNode===nd.id} onSelect={handleSelect} onContextMenu={handleCtxMenu} />
          ))}
          {/* Ghost node in s3 — 3rd horizontal slot */}
          <GhostNode x={NX+2*H_STEP} y={NY[2]} label="Add an action" />
        </div>

        {/* Canvas overlays */}
        <ZoomControls zoom={transform.scale}
          onZoomIn={()=>setTransform(t=>({...t,scale:Math.min(2.8,t.scale*1.15)}))}
          onZoomOut={()=>setTransform(t=>({...t,scale:Math.max(0.25,t.scale/1.15)}))}
          onReset={resetZoom} />
        <Minimap transform={transform} />
        <PaletteBar />
        {showDiff && <DiffOverlay />}
      </div>

      {/* Context menu */}
      {ctxMenu && (
        <>
          <div style={{position:'fixed',inset:0,zIndex:199}} onClick={()=>setCtxMenu(null)} />
          <ContextMenu {...ctxMenu} onClose={()=>setCtxMenu(null)} onDelete={deleteNode} />
        </>
      )}
    </div>
  );
}

        <div style={{marginBottom:16}}>
          <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.09em',textTransform:'uppercase',color:'var(--ink-45)',marginBottom:7}}>Trigger Type</div>
          <div style={{display:'flex',gap:3,padding:'3px',background:'var(--ink-05)',borderRadius:8}}>
            {[
                {id:'time',label:'Time',Icon:()=><svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>},
                {id:'user_request',label:'User Request',Icon:()=><svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>},
                {id:'platform_event',label:'Platform',Icon:()=><svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>}
              ].map(tt=>(
              <div key={tt.id} onClick={()=>setTriggerType(tt.id)}
                style={{flex:1,padding:'6px 4px',borderRadius:6,textAlign:'center',fontSize:10.5,fontWeight:triggerType===tt.id?600:400,cursor:'pointer',background:triggerType===tt.id?'var(--white)':'transparent',color:triggerType===tt.id?'var(--ink)':'var(--ink-45)',boxShadow:triggerType===tt.id?'0 1px 4px rgba(0,0,0,.09)':'none',transition:'all 0.12s',userSelect:'none',display:'flex',alignItems:'center',justifyContent:'center',gap:4,whiteSpace:'nowrap'}}>
                <span style={{display:'flex'}}><tt.Icon /></span>{tt.label}
              </div>
            ))}
          </div>
        </div>
        {/* Condition */}
        <div style={{marginBottom:16}}>
          <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.09em',textTransform:'uppercase',color:'var(--ink-45)',marginBottom:7}}>Condition</div>
          <textarea value={condition} onChange={e=>setCondition(e.target.value)} placeholder="Describe when this trigger should fire…"
            style={{width:'100%',minHeight:70,padding:'9px 11px',fontSize:12.5,border:'1px solid var(--ink-10)',borderRadius:8,background:'var(--bg)',color:'var(--ink)',outline:'none',fontFamily:'inherit',resize:'vertical',lineHeight:1.55,transition:'border-color 0.15s'}}
            onFocus={e=>e.target.style.borderColor='var(--ink-45)'} onBlur={e=>e.target.style.borderColor='var(--ink-10)'} />
        </div>
        {/* Webhook */}
        <div style={{marginBottom:16}}>
          <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.09em',textTransform:'uppercase',color:'var(--ink-45)',marginBottom:7}}>API / Webhook <span style={{fontWeight:400,textTransform:'none',letterSpacing:0,color:'var(--ink-22)'}}>optional</span></div>
          <input placeholder="https://api.example.com/webhook"
            style={{width:'100%',padding:'8px 10px',fontSize:11,border:'1px solid var(--ink-10)',borderRadius:8,background:'var(--bg)',color:'var(--ink-70)',outline:'none',fontFamily:"'SF Mono','Fira Code',monospace",transition:'border-color 0.15s'}}
            onFocus={e=>e.target.style.borderColor='var(--ink-45)'} onBlur={e=>e.target.style.borderColor='var(--ink-10)'} />
        </div>
      </>) : (
        /* Action: API sequence */
        <div style={{marginBottom:16}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:7}}>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.09em',textTransform:'uppercase',color:'var(--ink-45)'}}>API Sequence</div>
            <div onClick={addApiRow} style={{display:'flex',alignItems:'center',gap:3,fontSize:11,fontWeight:600,color:'var(--blue)',cursor:'pointer',transition:'opacity 0.12s'}}
              onMouseEnter={e=>e.currentTarget.style.opacity='.7'} onMouseLeave={e=>e.currentTarget.style.opacity='1'}>
              <I.plus/>Add
            </div>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:5}}>
            {apiRows.map((row)=>(
              <div key={row.id} style={{display:'flex',alignItems:'center',gap:6,padding:'7px 9px',background:'var(--bg)',border:'1px solid var(--ink-10)',borderRadius:8}}>
                <span style={{color:'var(--ink-22)',cursor:'grab',flexShrink:0,opacity:.5,display:'flex'}}><I.grip/></span>
                <select value={row.method} onChange={e=>updApiRow(row.id,'method',e.target.value)}
                  style={{fontSize:10,fontWeight:700,border:'none',background:'transparent',cursor:'pointer',color:row.method==='GET'?'var(--green)':row.method==='POST'?'var(--blue)':'var(--orange)',outline:'none',fontFamily:'inherit',flexShrink:0}}>
                  <option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option>
                </select>
                <input value={row.url} onChange={e=>updApiRow(row.id,'url',e.target.value)} placeholder="api.example.com/path"
                  style={{flex:1,border:'none',background:'transparent',fontSize:11,color:'var(--ink-70)',outline:'none',fontFamily:"'SF Mono','Fira Code',monospace",minWidth:0}} />
                {apiRows.length>1&&(
                  <span onClick={()=>removeApiRow(row.id)} style={{display:'flex',color:'var(--ink-22)',cursor:'pointer',flexShrink:0,transition:'color 0.12s'}}
                    onMouseEnter={e=>e.currentTarget.style.color='var(--red)'} onMouseLeave={e=>e.currentTarget.style.color='var(--ink-22)'}>
                    <svg width="10" height="10" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                  </span>
                )}
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Personality */}
      <div style={{marginBottom:16}}>
        <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.09em',textTransform:'uppercase',color:'var(--ink-45)',marginBottom:7}}>Personality</div>
        <div style={{display:'flex',flexDirection:'column',gap:4}}>
          {PERSONALITIES.map(p=>{
            const sel=personality===p.id;
            return(
              <div key={p.id} onClick={()=>setPersonality(p.id)}
                style={{display:'flex',alignItems:'center',gap:9,padding:'8px 10px',borderRadius:8,border:'1.5px solid '+(sel?p.color+'55':'var(--ink-10)'),background:sel?p.bg:'transparent',cursor:'pointer',transition:'all 0.12s',userSelect:'none'}}
                onMouseEnter={e=>{if(!sel){e.currentTarget.style.borderColor='var(--ink-22)';e.currentTarget.style.background='var(--ink-05)';}}}
                onMouseLeave={e=>{if(!sel){e.currentTarget.style.borderColor='var(--ink-10)';e.currentTarget.style.background='transparent';}}}>
                <span style={{width:9,height:9,borderRadius:'50%',background:p.color,flexShrink:0,opacity:sel?1:.5}}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12.5,fontWeight:sel?600:400,color:sel?'var(--ink)':'var(--ink-70)'}}>{p.name}</div>
                  <div style={{fontSize:10.5,color:'var(--ink-45)',lineHeight:1.3}}>{p.desc}</div>
                </div>
                {sel&&<span style={{display:'flex',color:p.color,flexShrink:0}}><I.check/></span>}
              </div>
            );
          })}
        </div>
      </div>

      {/* Policies */}
      <div style={{marginBottom:20}}>
        <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.09em',textTransform:'uppercase',color:'var(--ink-45)',marginBottom:8}}>Policies</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
          {POLICIES_LIST.map(pl=>{
            const on=policies.includes(pl.id);
            return(
              <div key={pl.id} onClick={()=>togglePolicy(pl.id)}
                style={{padding:'4px 10px',borderRadius:20,fontSize:11.5,fontWeight:on?600:400,cursor:'pointer',userSelect:'none',background:on?'var(--ink)':'var(--ink-05)',color:on?'var(--white)':'var(--ink-70)',border:'1px solid '+(on?'var(--ink)':'var(--ink-10)'),transition:'all 0.12s'}}>
                {pl.label}
              </div>
            );
          })}
        </div>
      </div>

      {/* Metadata */}
      <div style={{borderTop:'1px solid var(--ink-05)',paddingTop:14}}>
        <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.09em',textTransform:'uppercase',color:'var(--ink-22)',marginBottom:8}}>Metadata</div>
        {[
          {l:isTrigger?'Trigger code':'Action code', v:node.id},
          {l:'Skill',  v:skill?.label||node.skill},
          {l:'State',  v:'Onboarding'},
        ].map(m=>(
          <div key={m.l} style={{display:'flex',alignItems:'baseline',gap:6,marginBottom:5}}>
            <span style={{fontSize:10.5,color:'var(--ink-22)',flex:'0 0 72px'}}>{m.l}</span>
            <span style={{fontSize:10.5,fontFamily:"'SF Mono','Fira Code',monospace",color:'var(--ink-45)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{m.v}</span>
          </div>
        ))}
      </div>
    </div>
  );

  /* ── PROMPT TAB ── */
  const PromptTab = () => (
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      {/* Header */}
      <div style={{padding:'12px 14px 10px',borderBottom:'1px solid var(--ink-05)',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:3}}>
          <span style={{display:'flex',color:nt.color}}>{node.type==='trigger'?<I.zap/>:node.type==='error'?<I.warning/>:<I.arrow/>}</span>
          <span style={{fontSize:14,fontWeight:700,letterSpacing:'-0.015em',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{node.label}</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6,paddingLeft:20}}>
          <span style={{fontSize:10.5,color:'var(--ink-45)'}}>System prompt</span>
          <span style={{width:3,height:3,borderRadius:'50%',background:'var(--ink-22)'}}/>
          <span style={{fontSize:10.5,fontFamily:"'SF Mono','Fira Code',monospace",color:'var(--ink-45)'}}>{node.id}</span>
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'12px 14px 0'}}>
        <textarea value={promptText} onChange={e=>setPromptText(e.target.value)}
          style={{width:'100%',height:'100%',minHeight:260,padding:'11px 12px',fontSize:11.5,fontFamily:"'SF Mono','Fira Code','Consolas',monospace",border:'1px solid var(--ink-10)',borderRadius:9,background:'var(--black)',color:'rgba(255,255,255,.88)',outline:'none',resize:'none',lineHeight:1.8,transition:'border-color 0.15s',caretColor:'white'}}
          onFocus={e=>e.target.style.borderColor='rgba(255,255,255,.2)'} onBlur={e=>e.target.style.borderColor='var(--ink-10)'} />
      </div>
      <div style={{padding:'10px 14px 14px',borderTop:'1px solid var(--ink-05)',flexShrink:0}}>
        <div style={{fontSize:10,fontWeight:600,letterSpacing:'0.07em',textTransform:'uppercase',color:'var(--ink-22)',marginBottom:6,display:'flex',alignItems:'center',gap:5}}>
          <I.sparkle/>Format prompt with AI
        </div>
        <div style={{display:'flex',gap:6}}>
          <input value={aiInstruction} onChange={e=>setAiInstruction(e.target.value)} placeholder="e.g. Make it more empathetic…"
            onKeyDown={e=>{if(e.key==='Enter'&&aiInstruction.trim()){setPromptText(p=>p+'\n\n// AI instruction: '+aiInstruction);setAiInstruction('');}}}
            style={{flex:1,padding:'7px 10px',fontSize:12.5,border:'1px solid var(--ink-10)',borderRadius:7,background:'var(--white)',color:'var(--ink)',outline:'none',fontFamily:'inherit',transition:'border-color 0.15s'}}
            onFocus={e=>e.target.style.borderColor='var(--ink-45)'} onBlur={e=>e.target.style.borderColor='var(--ink-10)'} />
          <button onClick={()=>{if(aiInstruction.trim()){setPromptText(p=>p+'\n\n// AI: '+aiInstruction);setAiInstruction('');}}}
            style={{width:34,height:34,background:'var(--ink)',border:'none',borderRadius:7,cursor:'pointer',flexShrink:0,transition:'opacity 0.15s',display:'grid',placeItems:'center',color:'var(--white)'}}
            onMouseEnter={e=>e.currentTarget.style.opacity='.8'} onMouseLeave={e=>e.currentTarget.style.opacity='1'}>
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
  );

  /* ── TEST TAB ── */
  const TestTab = () => (
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <div style={{padding:'8px 14px',borderBottom:'1px solid var(--ink-05)',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{fontSize:10,fontWeight:500,color:'var(--ink-45)',lineHeight:1.4}}>
          Simulating as: <span style={{fontWeight:700,color:'var(--ink)'}}>Onboarding</span>
          <span style={{color:'var(--ink-22)'}}> · </span>
          <span style={{fontWeight:600,color:'var(--ink)'}}>{skill?.label||node.skill}</span>
        </div>
        <div onClick={()=>setChatMsgs([])} style={{fontSize:10.5,fontWeight:600,color:'var(--ink-22)',cursor:'pointer',userSelect:'none',transition:'color 0.12s'}}
          onMouseEnter={e=>e.currentTarget.style.color='var(--ink-70)'}
          onMouseLeave={e=>e.currentTarget.style.color='var(--ink-22)'}>
          Reset
        </div>
      </div>
      <div ref={chatBoxRef} style={{flex:1,overflowY:'auto',padding:'12px 14px',display:'flex',flexDirection:'column',gap:10}}>
        {chatMsgs.length===0 && (
          <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:7,opacity:.4,paddingTop:40}}>
            <svg width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
            <div style={{fontSize:12,fontWeight:500,color:'var(--ink-45)',textAlign:'center',lineHeight:1.5}}>Type a message to simulate<br/>the agent's response</div>
          </div>
        )}
        {chatMsgs.map(msg=>(
          <div key={msg.id} style={{display:'flex',flexDirection:'column',alignItems:msg.role==='user'?'flex-end':'flex-start',gap:3}}>
            <div style={{fontSize:9,fontWeight:700,letterSpacing:'0.07em',textTransform:'uppercase',color:'var(--ink-22)'}}>
              {msg.role==='user'?'You':'Agent · '+PERSONALITIES.find(p=>p.id===personality)?.name}
            </div>
            <div style={{maxWidth:'92%',padding:'8px 11px',fontSize:12.5,lineHeight:1.55,whiteSpace:'pre-wrap',wordBreak:'break-word',
              borderRadius:msg.role==='user'?'10px 10px 3px 10px':'10px 10px 10px 3px',
              background:msg.role==='user'?'var(--ink)':pb.bg,
              color:msg.role==='user'?'var(--white)':pb.color,
              border:msg.role==='user'?'none':'1px solid '+pb.border,
            }}>
              {msg.text}
            </div>
          </div>
        ))}
        {isTyping && (
          <div style={{display:'flex',flexDirection:'column',alignItems:'flex-start',gap:3}}>
            <div style={{fontSize:9,fontWeight:700,letterSpacing:'0.07em',textTransform:'uppercase',color:'var(--ink-22)'}}>
              Agent · {PERSONALITIES.find(p=>p.id===personality)?.name}
            </div>
            <div style={{padding:'10px 14px',borderRadius:'10px 10px 10px 3px',background:pb.bg,border:'1px solid '+pb.border,display:'flex',gap:4,alignItems:'center'}}>
              {[0,1,2].map(i=>(
                <span key={i} style={{width:5,height:5,borderRadius:'50%',background:pb.color,display:'inline-block',animation:'pulse 1.2s '+(i*0.22)+'s infinite'}}/>
              ))}
            </div>
          </div>
        )}
      </div>
      <div style={{padding:'10px 14px 14px',borderTop:'1px solid var(--ink-05)',flexShrink:0}}>
        <div style={{display:'flex',gap:6}}>
          <input value={chatInput} onChange={e=>setChatInput(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey)sendChat();}}
            placeholder="Type as the end user…"
            style={{flex:1,padding:'8px 10px',fontSize:12.5,border:'1px solid var(--ink-10)',borderRadius:8,background:'var(--white)',color:'var(--ink)',outline:'none',fontFamily:'inherit',transition:'border-color 0.15s'}}
            onFocus={e=>e.target.style.borderColor='var(--ink-45)'} onBlur={e=>e.target.style.borderColor='var(--ink-10)'} />
          <button onClick={sendChat}
            style={{width:34,height:34,background:chatInput.trim()&&!isTyping?'var(--ink)':'var(--ink-10)',border:'none',borderRadius:8,cursor:chatInput.trim()&&!isTyping?'pointer':'default',display:'grid',placeItems:'center',flexShrink:0,transition:'background 0.15s',color:chatInput.trim()&&!isTyping?'var(--white)':'var(--ink-22)'}}>
            <I.arrow/>
          </button>
        </div>
      </div>
    </div>
  );

  return (
    <div style={{width:280,flexShrink:0,background:'var(--white)',borderLeft:'1px solid var(--ink-10)',display:'flex',flexDirection:'column',overflow:'hidden'}}>
      {/* Tab bar */}
      <div style={{height:44,borderBottom:'1px solid var(--ink-10)',display:'flex',alignItems:'stretch',flexShrink:0}}>
        {[{id:'build',label:'Build',Icon:I.gear},{id:'prompt',label:'Prompt',Icon:I.terminal},{id:'test',label:'Test',Icon:I.play}].map(t=>(
          <div key={t.id} onClick={()=>setTab(t.id)}
            style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',gap:5,fontSize:12.5,fontWeight:tab===t.id?700:400,color:tab===t.id?'var(--ink)':'var(--ink-45)',cursor:'pointer',borderBottom:tab===t.id?'2.5px solid var(--ink)':'2.5px solid transparent',transition:'color 0.15s,border-color 0.15s',userSelect:'none',marginBottom:-1}}>
            <span style={{display:'flex',opacity:tab===t.id?1:0.6}}><t.Icon /></span>{t.label}
          </div>
        ))}
      </div>
      {tab==='build'  && <BuildTab/>}
      {tab==='prompt' && <PromptTab/>}
      {tab==='test'   && <TestTab/>}
    </div>
  );
}

/* ─── App ─── */
const TWEAK_DEFAULTS = { density:'regular', accent:'#3C9B6A' };

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [activeNav, setActiveNav] = useState('playbooks');
  const [selSkill, setSelSkill] = useState('ob-guide');
  const [selNode, setSelNode] = useState('n2');
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [configTab, setConfigTab] = useState('build');
  const [agentTestOpen, setAgentTestOpen] = useState(false);

  const handleTest = () => { setAgentTestOpen(true); };

  const handleSelectNode = (id) => {
    setSelNode(id);
    if (agentTestOpen) setAgentTestOpen(false);
  };

  return (
    <div style={{display:'flex',width:'100%',height:'100%',overflow:'hidden',fontFamily:"'Hanken Grotesk',system-ui,sans-serif"}}>
      <Sidebar active={activeNav} setActive={setActiveNav} open={sidebarOpen} />
      <div style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <Topbar sidebarOpen={sidebarOpen} setSidebarOpen={setSidebarOpen} selSkill={selSkill} />
        <div style={{flex:1,display:'flex',overflow:'hidden'}}>
          <PlaybookPanel sel={selSkill} setSel={setSelSkill} />
          <WorkflowCanvas selNode={selNode} setSelNode={handleSelectNode} onTest={handleTest} selSkill={selSkill} />
          {agentTestOpen
            ? <AgentTestPanel onClose={()=>setAgentTestOpen(false)} />
            : <NodeConfigPanel selId={selNode} configTab={configTab} setConfigTab={setConfigTab} />}
        </div>
      </div>
      <TweaksPanel>
        <TweakSection label="Appearance" />
        <TweakRadio label="Density" value={t.density} options={['compact','regular']} onChange={v=>setTweak('density',v)} />
        <TweakColor label="Accent" value={t.accent} options={['#3C9B6A','#3562C8','#7C51D8','#C05FA0']} onChange={v=>setTweak('accent',v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>


</body></html>
