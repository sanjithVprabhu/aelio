# Local dev infrastructure. NOTE: apps/api runs fine WITHOUT any of this —
# it falls back to in-memory persistence and a scripted LLM provider when the
# corresponding env vars are unset. Bring this up only when you want to exercise
# the real Postgres / Redis / S3 / mail paths.
services:
  postgres:
    image: pgvector/pgvector:pg16
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: aelio_dev
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mailhog:
    image: mailhog/mailhog
    ports: ["1025:1025", "8025:8025"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345

volumes:
  pgdata:
