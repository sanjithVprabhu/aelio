# apps/admin — SaaS-Facing Dashboard (Next.js 15). Self-hosted on EKS option
# (§11.2). Static assets are served from CloudFront/CDN; this Deployment serves
# SSR/server-components + server actions that proxy to apps/api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: aelio
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/part-of: aelio
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: admin
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin
        app.kubernetes.io/part-of: aelio
    spec:
      nodeSelector:
        aelio.dev/node-pool: general
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin
          image: REGISTRY/aelio/admin:latest # patched per-env
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: aelio-shared-config
            - secretRef:
                name: aelio-app-secrets
          env:
            - name: APP_NAME
              value: "admin"
            - name: PORT
              value: "3001"
            # NEXT_PUBLIC_* are baked at build time; server-only keys come from
            # the Secret (e.g. CLERK_SECRET_KEY).
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          # Next.js writes its server cache under .next/cache; mount writable tmp.
          volumeMounts:
            - name: cache
              mountPath: /repo/apps/admin/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
