# Keep at least one admin origin available during voluntary disruptions.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: admin
  namespace: aelio
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/part-of: aelio
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin
