# Service for apps/admin. Fronted by CloudFront (static assets) + ALB (SSR).
# Stateless SSR — no session affinity needed.
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: aelio
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/part-of: aelio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: admin
  ports:
    - name: http
      port: 3001
      targetPort: http
      protocol: TCP
