# EXAMPLE ONLY — non-sensitive shared config + a placeholder Secret manifest.
#
# Real secrets are NOT stored in Git. In production they are synced from AWS
# Secrets Manager (§12.1, §13.2 "All secrets in AWS Secrets Manager. No .env
# files in repo.") into Kubernetes Secrets via the External Secrets Operator
# (ESO) / Secrets Store CSI driver. This file documents the *shape* only.
#
# ---------------------------------------------------------------------------
# Shared, non-sensitive configuration consumed by all apps via envFrom.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: aelio-shared-config
  namespace: aelio
data:
  NODE_ENV: "production"
  AWS_REGION: "us-east-1"
  # Internal cluster service URLs (see each app's Service).
  API_BASE_URL: "http://api.aelio.svc.cluster.local:3000"
  # Datadog / OTel exporter endpoints (§13.1).
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://datadog-agent.observability.svc.cluster.local:4317"
  LANGFUSE_HOST: "https://cloud.langfuse.com"
---
# ---------------------------------------------------------------------------
# Placeholder Secret — DO NOT commit real values. In-cluster this object is
# produced by ESO from an ExternalSecret that references Secrets Manager paths
# like  aelio/<region>/api  and  aelio/<region>/shared.
#
# Example ExternalSecret (managed elsewhere, shown for reference):
#   spec.dataFrom[0].extract.key: aelio/us-east-1/api
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: aelio-app-secrets
  namespace: aelio
  annotations:
    # Marker so humans/automation know this is a synced, not hand-edited, object.
    aelio.dev/managed-by: "external-secrets-operator"
type: Opaque
stringData:
  # All values below are PLACEHOLDERS — replaced at sync time.
  CLERK_SECRET_KEY: "REPLACED_BY_EXTERNAL_SECRETS"
  CLERK_WEBHOOK_SECRET: "REPLACED_BY_EXTERNAL_SECRETS"
  INTERNAL_SERVICE_SECRET: "REPLACED_BY_EXTERNAL_SECRETS"
  META_APP_SECRET: "REPLACED_BY_EXTERNAL_SECRETS"
  SLACK_SIGNING_SECRET: "REPLACED_BY_EXTERNAL_SECRETS"
  TWILIO_AUTH_TOKEN: "REPLACED_BY_EXTERNAL_SECRETS"
  STRIPE_SECRET_KEY: "REPLACED_BY_EXTERNAL_SECRETS"
  DATABASE_URL: "REPLACED_BY_EXTERNAL_SECRETS"
  REDIS_URL: "REPLACED_BY_EXTERNAL_SECRETS"
  DEEPGRAM_API_KEY: "REPLACED_BY_EXTERNAL_SECRETS"
  ELEVENLABS_API_KEY: "REPLACED_BY_EXTERNAL_SECRETS"
