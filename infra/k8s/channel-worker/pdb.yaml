# Protect web-chat availability during node drains/rollouts.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: channel-worker
  namespace: aelio
  labels:
    app.kubernetes.io/name: channel-worker
    app.kubernetes.io/part-of: aelio
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: channel-worker
